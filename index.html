<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Tracker">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-alt: #2c2c2e;
      --accent: #0a84ff;
      --text: #ffffff;
      --muted: #8e8e93;
      --border: #38383a;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --purple: #bf5af2;
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      padding: env(safe-area-inset-top, 24px) 16px calc(env(safe-area-inset-bottom, 24px) + 80px);
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .nav-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 4px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:active {
      transform: scale(0.97);
      transition: transform 0.05s ease;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 17px; font-weight: 600; }
    .card-badge {
      font-size: 11px;
      background: rgba(191, 90, 242, 0.2);
      color: var(--purple);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .card-meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .rest-badge {
      background: rgba(10, 132, 255, 0.15);
      color: var(--accent);
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-swap-toggle {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
    }
    .swap-panel {
      background: #252528;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 12px;
      display: flex;
      gap: 6px;
    }
    .swap-select {
      flex: 1;
      background: var(--card-alt);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
    }
    .warmup-box {
      background: rgba(255, 159, 10, 0.12);
      border: 1px dashed var(--orange);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #ffd60a;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .set-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr 40px 36px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .set-label { color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
    input {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 4px;
      font-size: 16px;
      text-align: center;
      width: 100%;
    }
    input::placeholder { color: #636366; font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent); }
    .remarks-input {
      margin-top: 8px;
      text-align: left;
      padding: 8px 10px;
      font-size: 13px;
      border-color: #2c2c2e;
    }
    .btn-check {
      background: var(--card-alt);
      border: none;
      color: var(--green);
      font-size: 16px;
      border-radius: 8px;
      height: 38px;
    }
    .btn-check.done { background: var(--green); color: #000; font-weight: bold; }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--red);
      font-size: 16px;
      height: 38px;
      opacity: 0.7;
    }
    .btn-secondary {
      width: 100%;
      background: var(--card-alt);
      color: var(--accent);
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
    }
    .btn-finish {
      width: 100%;
      background: var(--green);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 18px;
    }
    .history-month { font-size: 16px; font-weight: 700; color: var(--accent); margin: 18px 0 8px; }
    .history-item { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
    .history-item-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .history-actions { display: flex; gap: 8px; }
    .history-row { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .history-remarks { font-size: 12px; color: #ffd60a; margin-top: 2px; margin-bottom: 6px; font-style: italic; }
    .btn-edit { background: transparent; border: none; color: var(--accent); font-size: 13px; font-weight: 600; }
    .btn-export { background: var(--card); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
    .btn-clear-all { background: var(--card); border: 1px solid var(--border); color: var(--red); padding: 8px 12px; border-radius: 8px; font-size: 12px; }

    /* Floating Rest Timer Bar */
    #rest-timer-bar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
      left: 16px;
      right: 16px;
      background: #1c1c1e;
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    .timer-info { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .timer-val { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--accent); }
    .timer-btns { display: flex; gap: 6px; }
    .timer-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>

          { name: "Seated Leg Curl", sets: [{ weight: "32", reps: "12" }, { weight: "32", reps: "12" }], remarks: "" },
          { name: "Incline Bicep Curl", sets: [{ weight: "5", reps: "12" }, { weight: "5", reps: "12" }, { weight: "5", reps: "12" }], remarks: "" },
          { name: "Lateral Raises", sets: [{ weight: "5", reps: "15" }, { weight: "5", reps: "14" }, { weight: "5", reps: "13" }], remarks: "" }
        ]
      },
      {
        id: 1722816000000, date: "2026-08-05", day: "Day 2",
        exercises: [
          { name: "Cable Row", sets: [{ weight: "36", reps: "8" }, { weight: "36", reps: "8" }, { weight: "36", reps: "10" }], remarks: "" },
          { name: "Dumbbell Press", sets: [{ weight: "15", reps: "10" }, { weight: "15", reps: "10" }, { weight: "15", reps: "10" }], remarks: "" },
          { name: "Quad-Biased Split Squat", sets: [{ weight: "7.5", reps: "10" }, { weight: "7.5", reps: "10" }], remarks: "" },
          { name: "Chest Fly", sets: [{ weight: "25", reps: "15" }, { weight: "20", reps: "15" }, { weight: "20", reps: "15" }], remarks: "" },
          { name: "Leg Press", sets: [{ weight: "20", reps: "10" }, { weight: "20", reps: "10" }], remarks: "" },
          { name: "Triceps Rope Pushdown", sets: [{ weight: "20", reps: "15" }, { weight: "20", reps: "11" }, { weight: "20", reps: "6" }], remarks: "" }
        ]
      },
      {
        id: 1722643200000, date: "2026-08-03", day: "Day 1",
        exercises: [
          { name: "Lat Pulldown", sets: [{ weight: "38", reps: "10" }, { weight: "38", reps: "10" }, { weight: "38", reps: "10" }], remarks: "" },
          { name: "Machine Shoulder Press", sets: [{ weight: "11.25", reps: "10" }, { weight: "11.25", reps: "10" }, { weight: "11.25", reps: "10" }], remarks: "" },
          { name: "Hip-Dominant Split Squat", sets: [{ weight: "15", reps: "10" }, { weight: "15", reps: "10" }], remarks: "" },
          { name: "Hip Thrust", sets: [{ weight: "20", reps: "10" }, { weight: "20", reps: "10" }], remarks: "" },
          { name: "Seated Leg Curl", sets: [{ weight: "27", reps: "15" }, { weight: "29", reps: "15" }], remarks: "" },
          { name: "Bicep Curl", sets: [{ weight: "6", reps: "12" }, { weight: "6", reps: "12" }, { weight: "6", reps: "12" }], remarks: "" },
          { name: "Lateral Raises", sets: [{ weight: "5", reps: "15" }, { weight: "5", reps: "15" }, { weight: "5", reps: "14" }], remarks: "" }
        ]
      },
      {
        id: 1722384000000, date: "2026-07-31", day: "Day 2",
        exercises: [
          { name: "Cable Row", sets: [{ weight: "32", reps: "10" }, { weight: "34", reps: "10" }, { weight: "36", reps: "7" }], remarks: "" },
          { name: "Dumbbell Press", sets: [{ weight: "12.5", reps: "10" }, { weight: "12.5", reps: "10" }, { weight: "12.5", reps: "14" }], remarks: "" },
          { name: "Quad-Biased Split Squat", sets: [{ weight: "10", reps: "10" }, { weight: "10", reps: "10" }], remarks: "" },
          { name: "Triceps Rope Pushdown", sets: [{ weight: "18", reps: "15" }, { weight: "18", reps: "15" }, { weight: "18", reps: "10" }], remarks: "" },
          { name: "Chest Fly", sets: [{ weight: "25", reps: "15" }, { weight: "25", reps: "13" }, { weight: "25", reps: "10" }], remarks: "" },
          { name: "Hack Squat", sets: [{ weight: "0", reps: "10" }, { weight: "0", reps: "10" }], remarks: "" }
        ]
      },
      {
        id: 1722211200000, date: "2026-07-29", day: "Day 1",
        exercises: [
          { name: "Lat Pulldown", sets: [{ weight: "36", reps: "8" }, { weight: "36", reps: "10" }, { weight: "38", reps: "10" }], remarks: "" },
          { name: "Hip-Dominant Split Squat", sets: [{ weight: "10", reps: "10" }, { weight: "12", reps: "12" }], remarks: "" },
          { name: "Machine Shoulder Press", sets: [{ weight: "10", reps: "10" }, { weight: "11.25", reps: "8" }, { weight: "11.25", reps: "10" }], remarks: "" },
          { name: "Hip Thrust", sets: [{ weight: "15", reps: "12" }, { weight: "17.5", reps: "12" }], remarks: "" },
          { name: "Seated Leg Curl", sets: [{ weight: "25", reps: "12" }, { weight: "25", reps: "15" }], remarks: "" },
          { name: "Bicep Curl", sets: [{ weight: "6", reps: "12" }, { weight: "6", reps: "12" }, { weight: "6", reps: "12" }], remarks: "" },
          { name: "Lateral Raises", sets: [{ weight: "5", reps: "12" }, { weight: "5", reps: "14" }], remarks: "" }
        ]
      }
    ];

    let currentView = "day1";
    let state = JSON.parse(localStorage.getItem("tracker_state") || "null");
    let editingHistoryId = null;

    let timerInterval = null;
    let timerEndTime = null;

    if (!state || state.version !== APP_VERSION) {
      const existingHistory = (state && state.history && state.history.length > 0) ? state.history : initialHistory;
      state = {
        version: APP_VERSION,
        templates: (state && state.templates) ? state.templates : JSON.parse(JSON.stringify(defaultTemplates)),
        active: { day1: [], day2: [] },
        history: existingHistory
      };
      initActiveSets("day1");
      initActiveSets("day2");
      saveState();
    }

    function initActiveSets(day) {
      state.active[day] = state.templates[day].map(ex => ({
        name: ex.name,
        originalName: ex.name,
        target: ex.target,
        restSec: ex.restSec || 120,
        remarks: "",
        showSwap: false,
        sets: Array.from({ length: ex.sets || 3 }, () => ({ weight: "", reps: "", done: false }))
      }));
    }

    function saveState() {
      localStorage.setItem("tracker_state", JSON.stringify(state));
    }

    function findLatestWeight(exerciseName) {
      for (const session of state.history) {
        const found = session.exercises.find(e => e.name.toLowerCase() === exerciseName.toLowerCase());
        if (found && found.sets.length > 0) {
          const lastSet = found.sets[found.sets.length - 1];
          return { weight: lastSet.weight, reps: lastSet.reps };
        }
      }
      return null;
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", (view === "day1" && idx === 0) || (view === "day2" && idx === 1) || (view === "history" && idx === 2));
      });
      
      const isHist = view === "history";
      document.getElementById("workout-view").style.display = isHist ? "none" : "block";
      document.getElementById("history-view").style.display = isHist ? "block" : "none";
      document.getElementById("export-btn").style.display = isHist ? "block" : "none";
      document.getElementById("clear-btn").style.display = isHist ? "block" : "none";
      document.getElementById("view-title").innerText = isHist ? "Workout History" : (view === "day1" ? "Day 1 Workout" : "Day 2 Workout");

      if (isHist) renderHistory();
      else renderWorkout();
    }

    function renderWorkout() {
      const container = document.getElementById("exercise-list");
      container.innerHTML = "";
      const exercises = state.active[currentView];

      exercises.forEach((ex, exIdx) => {
        const tpl = state.templates[currentView].find(t => t.name === ex.originalName) || {};
        const isSwapped = ex.name !== ex.originalName;

        let phWeight = "";
        let phReps = "";
        const historicalMatch = findLatestWeight(ex.name);
        if (historicalMatch) {
          phWeight = `${historicalMatch.weight} kg`;
          phReps = `${historicalMatch.reps}`;
        } else if (!isSwapped && tpl.lastWeight !== undefined) {
          phWeight = `${tpl.lastWeight} kg`;
          phReps = `${tpl.lastReps}`;
        } else {
          phWeight = "kg";
          phReps = "reps";
        }

        const baseWeight = parseFloat(ex.sets[0]?.weight) || parseFloat(historicalMatch?.weight) || (isSwapped ? 0 : parseFloat(tpl.lastWeight)) || 0;
        const w1 = (baseWeight * 0.5).toFixed(1).replace(/\.0$/, '');
        const w2 = (baseWeight * 0.8).toFixed(1).replace(/\.0$/, '');

        const card = document.createElement("div");
        card.className = "card";

        const optionsList = (swapCatalog[ex.originalName] || []).concat(["+ Custom Exercise...", `↺ Revert to ${ex.originalName}`]);
        let optionsHTML = optionsList.map(opt => `<option value="${opt}">${opt}</option>`).join("");

        let swapPanelHTML = ex.showSwap ? `
          <div class="swap-panel">
            <select class="swap-select" onchange="executeSwap(${exIdx}, this.value)">
              <option value="" disabled selected>Select alternative equipment...</option>
              ${optionsHTML}
            </select>
            <button class="btn-del" onclick="toggleSwap(${exIdx})">✕</button>
          </div>
        ` : '';

        let setsHTML = ex.sets.map((set, sIdx) => `
          <div class="set-row">
            <span class="set-label">S${sIdx + 1}</span>
            <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="${phWeight}" value="${set.weight}" 
                   oninput="updateSet(${exIdx}, ${sIdx}, 'weight', this.value)">
            <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="${phReps}" value="${set.reps}" 
                   oninput="updateSet(${exIdx}, ${sIdx}, 'reps', this.value)">
            <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleDone(${exIdx}, ${sIdx})">✓</button>
            <button class="btn-del" onclick="deleteSet(${exIdx}, ${sIdx})">✕</button>
          </div>
        `).join("");

        const restMins = (ex.restSec / 60).toFixed(1).replace(/\.0$/, '');

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title-group">
              <span class="card-title">${ex.name}</span>
              ${isSwapped ? '<span class="card-badge">Swapped</span>' : ''}
            </div>
            <div class="card-meta">
              <span class="card-target">${ex.target || ''}</span>
              <span class="rest-badge" onclick="startRestTimer(${ex.restSec})">⏱️ ${restMins}m</span>
              <button class="btn-swap-toggle" onclick="toggleSwap(${exIdx})">⇄ Swap</button>
            </div>
          </div>
          ${swapPanelHTML}
          <div id="warmup-box-${exIdx}" class="warmup-box" style="${baseWeight > 0 ? 'display:flex;' : 'display:none;'}">
            <span>Warm-up 1 (50%): <strong id="w1-val-${exIdx}">${w1} kg</strong></span>
            <span>Warm-up 2 (80%): <strong id="w2-val-${exIdx}">${w2} kg</strong></span>
          </div>
          ${setsHTML}
          <input type="text" class="remarks-input" placeholder="💬 Remarks / Notes (e.g., machine setup, feel)..." 
                 value="${ex.remarks || ''}" oninput="updateRemarks(${exIdx}, this.value)">
          <button class="btn-secondary" onclick="addSet(${exIdx})">+ Add Set</button>
        `;
        container.appendChild(card);
      });
    }

    function toggleSwap(exIdx) {
      const ex = state.active[currentView][exIdx];
      ex.showSwap = !ex.showSwap;
      renderWorkout();
    }

    function executeSwap(exIdx, chosen) {
      const ex = state.active[currentView][exIdx];
      if (chosen.startsWith("↺ Revert")) {
        ex.name = ex.originalName;
      } else if (chosen === "+ Custom Exercise...") {
        const customName = prompt("Enter replacement machine/exercise:");
        if (customName) ex.name = customName.trim();
      } else {
        ex.name = chosen;
      }
      ex.showSwap = false;
      saveState();
      renderWorkout();
    }

    function updateSet(exIdx, sIdx, field, val) {
      state.active[currentView][exIdx].sets[sIdx][field] = val;
      saveState();

      if (sIdx === 0 && field === 'weight') {
        const ex = state.active[currentView][exIdx];
        const tpl = state.templates[currentView].find(t => t.name === ex.originalName) || {};
        const isSwapped = ex.name !== ex.originalName;
        const historicalMatch = findLatestWeight(ex.name);
        const baseWeight = parseFloat(val) || parseFloat(historicalMatch?.weight) || (isSwapped ? 0 : parseFloat(tpl.lastWeight)) || 0;
        
        const box = document.getElementById(`warmup-box-${exIdx}`);
        const w1El = document.getElementById(`w1-val-${exIdx}`);
        const w2El = document.getElementById(`w2-val-${exIdx}`);
        if (box && w1El && w2El) {
          if (baseWeight > 0) {
            box.style.display = "flex";
            const w1 = (baseWeight * 0.5).toFixed(1).replace(/\.0$/, '');
            const w2 = (baseWeight * 0.8).toFixed(1).replace(/\.0$/, '');
            w1El.innerText = `${w1} kg`;
            w2El.innerText = `${w2} kg`;
          } else {
            box.style.display = "none";
          }
        }
      }
    }

    function updateRemarks(exIdx, val) {
      state.active[currentView][exIdx].remarks = val;
      saveState();
    }

    function toggleDone(exIdx, sIdx) {
      const ex = state.active[currentView][exIdx];
      const set = ex.sets[sIdx];
      set.done = !set.done;
      saveState();
      renderWorkout();
      if (set.done) {
        startRestTimer(ex.restSec || 120);
      }
    }

    function addSet(exIdx) {
      const sets = state.active[currentView][exIdx].sets;
      const last = sets[sets.length - 1] || { weight: "", reps: "" };
      sets.push({ weight: last.weight, reps: last.reps, done: false });
      saveState();
      renderWorkout();
    }

    function deleteSet(exIdx, sIdx) {
      const sets = state.active[currentView][exIdx].sets;
      if (sets.length <= 1) {
        sets[0] = { weight: "", reps: "", done: false };
      } else {
        sets.splice(sIdx, 1);
      }
      saveState();
      renderWorkout();
    }

    function addExercisePrompt() {
      const name = prompt("Enter new exercise name:");
      if (!name) return;
      const target = prompt("Target reps (e.g., 8-10 reps):") || "8-10 reps";
      const rest = parseInt(prompt("Rest time in seconds (e.g., 120):") || "120");
      
      state.templates[currentView].push({ name, target, restSec: rest, sets: 3 });
      state.active[currentView].push({
        name,
        originalName: name,
        target,
        restSec: rest,
        remarks: "",
        showSwap: false,
        sets: [{ weight: "", reps: "", done: false }]
      });
      saveState();
      renderWorkout();
    }

    function startRestTimer(seconds) {
      clearInterval(timerInterval);
      timerEndTime = Date.now() + (seconds * 1000);
      const bar = document.getElementById("rest-timer-bar");
      bar.style.display = "flex";
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        const remaining = Math.round((timerEndTime - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          bar.style.display = "none";
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else {
          updateTimerDisplay();
        }
      }, 500);
    }

    function adjustRestTimer(deltaSec) {
      if (timerEndTime) {
        timerEndTime += deltaSec * 1000;
        updateTimerDisplay();
      }
    }

    function stopRestTimer() {
      clearInterval(timerInterval);
      document.getElementById("rest-timer-bar").style.display = "none";
    }

    function updateTimerDisplay() {
      const remaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
      const m = Math.floor(remaining / 60).toString().padStart(2, '0');
      const s = (remaining % 60).toString().padStart(2, '0');
      document.getElementById("timer-display").innerText = `${m}:${s}`;
    }

    function finishWorkout() {
      const activeExs = state.active[currentView];
      const dateStr = new Date().toISOString().split("T")[0];
      const completedExercises = [];

      activeExs.forEach(ex => {
        const filledSets = ex.sets.filter(s => s.weight !== "" && s.reps !== "");
        if (filledSets.length > 0) {
          completedExercises.push({
            name: ex.name,
            sets: filledSets.map(s => ({ weight: s.weight, reps: s.reps })),
            remarks: ex.remarks || ""
          });
          const tpl = state.templates[currentView].find(t => t.name === ex.originalName);
          if (tpl && ex.name === ex.originalName) {
            tpl.lastWeight = filledSets[filledSets.length - 1].weight;
            tpl.lastReps = filledSets[filledSets.length - 1].reps;
          }
        }
      });

      if (completedExercises.length === 0) {
        alert("Please log at least one set with weight and reps before finishing.");
        return;
      }

      state.history.unshift({
        id: Date.now(),
        date: dateStr,
        day: currentView === "day1" ? "Day 1" : "Day 2",
        exercises: completedExercises
      });

      stopRestTimer();
      initActiveSets(currentView);
      saveState();

      // Automatic background sync using phone-stored key
      if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("https")) {
        let userKey = localStorage.getItem("sheet_sync_key");
        if (!userKey) {
          userKey = prompt("Enter your private Sheet Sync Key:");
          if (userKey) localStorage.setItem("sheet_sync_key", userKey.trim());
        }
      
        if (userKey) {
          fetch(GOOGLE_SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              key: userKey,
              date: dateStr,
              day: currentView === "day1" ? "Day 1" : "Day 2",
              exercises: completedExercises
            })
          }).catch(err => console.error("Sheet sync failed:", err));
        }
      }

      alert("Workout archived! Inputs refreshed for your next session.");
      setView("history");
    }

    function renderHistory() {
      const container = document.getElementById("history-view");
      container.innerHTML = "";

      if (state.history.length === 0) {
        container.innerHTML = `<div style="color: var(--muted); text-align: center; margin-top: 40px;">No completed workouts logged yet.</div>`;
        return;
      }

      const groups = {};
      state.history.forEach(item => {
        const monthYear = new Date(item.date).toLocaleString('default', { month: 'long', year: 'numeric' });
        if (!groups[monthYear]) groups[monthYear] = [];
        groups[monthYear].push(item);
      });

      for (const [month, entries] of Object.entries(groups)) {
        const monthHeader = document.createElement("div");
        monthHeader.className = "history-month";
        monthHeader.innerText = month;
        container.appendChild(monthHeader);

        entries.forEach(entry => {
          const item = document.createElement("div");
          item.className = "history-item";

          if (editingHistoryId === entry.id) {
            let editExercisesHTML = entry.exercises.map((e, eIdx) => {
              let setsEdit = e.sets.map((s, sIdx) => `
                <div class="set-row" style="margin-bottom: 4px;">
                  <span class="set-label">S${sIdx + 1}</span>
                  <input type="text" inputmode="decimal" value="${s.weight}" oninput="state.history.find(h=>h.id===${entry.id}).exercises[${eIdx}].sets[${sIdx}].weight=this.value">
                  <input type="text" inputmode="numeric" value="${s.reps}" oninput="state.history.find(h=>h.id===${entry.id}).exercises[${eIdx}].sets[${sIdx}].reps=this.value">
                  <span></span>
                  <span></span>
                </div>
              `).join("");

              return `
                <div style="margin-bottom: 12px; border-top: 1px solid var(--border); padding-top: 8px;">
                  <div style="font-weight: 600; font-size: 14px; margin-bottom: 6px;">${e.name}</div>
                  ${setsEdit}
                  <input type="text" class="remarks-input" placeholder="Remarks" value="${e.remarks || ''}" 
                         oninput="state.history.find(h=>h.id===${entry.id}).exercises[${eIdx}].remarks=this.value">
                </div>
              `;
            }).join("");

            item.innerHTML = `
              <div class="history-item-header">
                <input type="date" value="${entry.date}" style="width: auto; padding: 4px 8px; font-size: 13px;"
                       oninput="state.history.find(h=>h.id===${entry.id}).date=this.value">
                <div class="history-actions">
                  <button class="btn-edit" style="color: var(--green);" onclick="saveHistoryEdit()">Save</button>
                  <button class="btn-del" style="height: auto;" onclick="cancelHistoryEdit()">✕</button>
                </div>
              </div>
              ${editExercisesHTML}
            `;
          } else {
            let rowsHTML = entry.exercises.map(e => `
              <div class="history-row">
                <strong>${e.name}:</strong> ${e.sets.map(s => `${s.weight}kg × ${s.reps}`).join(", ")}
                ${e.remarks ? `<div class="history-remarks">💬 ${e.remarks}</div>` : ''}
              </div>
            `).join("");

            item.innerHTML = `
              <div class="history-item-header">
                <span>${entry.day} — ${entry.date}</span>
                <div class="history-actions">
                  <button class="btn-edit" onclick="startHistoryEdit(${entry.id})">✎ Edit</button>
                  <button class="btn-del" style="height: auto; padding: 0 4px;" onclick="deleteHistoryEntry(${entry.id})">✕</button>
                </div>
              </div>
              ${rowsHTML}
            `;
          }

          container.appendChild(item);
        });
      }
    }

    function startHistoryEdit(id) {
      editingHistoryId = id;
      renderHistory();
    }

    function saveHistoryEdit() {
      editingHistoryId = null;
      saveState();
      renderHistory();
    }

    function cancelHistoryEdit() {
      editingHistoryId = null;
      state = JSON.parse(localStorage.getItem("tracker_state"));
      renderHistory();
    }

    function deleteHistoryEntry(id) {
      if (confirm("Delete this completed workout from history?")) {
        state.history = state.history.filter(session => session.id !== id);
        saveState();
        renderHistory();
      }
    }

    function clearAllHistory() {
      if (confirm("Are you sure you want to delete ALL workout history? This action cannot be undone.")) {
        state.history = [];
        saveState();
        renderHistory();
      }
    }

    function exportCSV() {
      if (state.history.length === 0) {
        alert("No history data to export.");
        return;
      }
      let csv = "Date,Day,Exercise,Set,Weight (kg),Reps,Remarks\n";
      state.history.forEach(session => {
        session.exercises.forEach(ex => {
          ex.sets.forEach((set, idx) => {
            csv += `"${session.date}","${session.day}","${ex.name}","Set ${idx + 1}","${set.weight}","${set.reps}","${(ex.remarks || '').replace(/"/g, '""')}"\n`;
          });
        });
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `workout_history_${new Date().toISOString().split("T")[0]}.csv`);
      a.click();
    }

    renderWorkout();
  </script>
</body>
