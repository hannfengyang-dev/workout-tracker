<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --accent: #0a84ff;
      --text: #ffffff;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --green: #30d158;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }
    header { padding: 12px 0 16px; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .exercise-card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .exercise-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 44px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .set-num { color: var(--muted); font-weight: 600; font-size: 14px; text-align: center; }
    input {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 16px; /* Prevents auto-zoom in iOS Safari */
      text-align: center;
      width: 100%;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn-save {
      background: #2c2c2e;
      border: none;
      color: var(--green);
      font-weight: 700;
      font-size: 18px;
      border-radius: 8px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-save.saved { background: var(--green); color: #000; }
    .btn-action {
      width: 100%;
      background: #2c2c2e;
      color: var(--accent);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Workout Log</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchDay(1)">Day A</button>
    <button class="tab-btn" onclick="switchDay(2)">Day B</button>
    <button class="tab-btn" onclick="switchDay(3)">Day C</button>
  </div>

  <div id="exercise-list"></div>

  <button class="btn-action" onclick="addExercisePrompt()">+ Add Custom Exercise</button>

  <script>
    const defaultRoutines = {
      1: ["Squat", "Bench Press", "Barbell Row"],
      2: ["Deadlift", "Overhead Press", "Lat Pulldown"],
      3: ["Leg Press", "Incline Dumbbell Press", "Cable Row"]
    };

    let currentDay = 1;
    let data = JSON.parse(localStorage.getItem("workoutData") || "{}");

    function getExercises(day) {
      if (!data[day]) {
        data[day] = defaultRoutines[day].map(name => ({
          name,
          sets: [{ weight: "", reps: "", saved: false }]
        }));
        persist();
      }
      return data[day];
    }

    function persist() {
      localStorage.setItem("workoutData", JSON.stringify(data));
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === day);
      });
      render();
    }

    function render() {
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";
      const exercises = getExercises(currentDay);

      exercises.forEach((ex, exIdx) => {
        const card = document.createElement("div");
        card.className = "exercise-card";
        
        let setsHTML = ex.sets.map((s, sIdx) => `
          <div class="set-row">
            <span class="set-num">${sIdx + 1}</span>
            <input type="number" step="any" placeholder="kg" value="${s.weight}" 
                   oninput="updateSet(${exIdx}, ${sIdx}, 'weight', this.value)">
            <input type="number" placeholder="reps" value="${s.reps}" 
                   oninput="updateSet(${exIdx}, ${sIdx}, 'reps', this.value)">
            <button class="btn-save ${s.saved ? 'saved' : ''}" 
                    onclick="toggleSave(${exIdx}, ${sIdx})">✓</button>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="exercise-title">${ex.name}</div>
          ${setsHTML}
          <button class="btn-action" onclick="addSet(${exIdx})">+ Add Set</button>
        `;
        list.appendChild(card);
      });
    }

    function updateSet(exIdx, setIdx, field, val) {
      data[currentDay][exIdx].sets[setIdx][field] = val;
      data[currentDay][exIdx].sets[setIdx].saved = false;
      persist();
    }

    function toggleSave(exIdx, setIdx) {
      const set = data[currentDay][exIdx].sets[setIdx];
      set.saved = !set.saved;
      persist();
      render();
    }

    function addSet(exIdx) {
      const prevSet = data[currentDay][exIdx].sets.slice(-1)[0] || { weight: "", reps: "" };
      data[currentDay][exIdx].sets.push({ weight: prevSet.weight, reps: prevSet.reps, saved: false });
      persist();
      render();
    }

    function addExercisePrompt() {
      const name = prompt("Exercise name:");
      if (!name) return;
      data[currentDay].push({ name, sets: [{ weight: "", reps: "", saved: false }] });
      persist();
      render();
    }

    render();
  </script>
</body>
</html>
